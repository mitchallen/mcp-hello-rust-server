name: cargo-audit
# Scan the Rust dependency tree (Cargo.lock) against the RustSec advisory DB.
# Trivy's image scan covers the OS layer; this covers the crates compiled into
# the binary — the two together are the full "are we shipping known vulns?" gate.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '23 6 * * *' # daily — a new advisory can land against an unchanged lockfile

jobs:
  audit:
    runs-on: ubuntu-latest
    # The repo's default GITHUB_TOKEN is read-only. On push/schedule the action
    # reports via a check run and opens issues for new advisories (on PRs it only
    # prints), so those events fail with "Resource not accessible by integration"
    # without these.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
